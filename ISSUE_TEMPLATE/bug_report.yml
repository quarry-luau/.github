name: Bug report
description: Quarry does something wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. The smaller the example, the faster it gets fixed.
  - type: input
    id: version
    attributes:
      label: Version
      description: The quarry and react-quarry versions from your wally.lock
      placeholder: quarry 0.1.0, react-quarry 0.1.0
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code that shows it
      description: The smallest code that reproduces the problem
      render: luau
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include any error and its stack trace
    validations:
      required: true
  - type: textarea
    id: tanstack
    attributes:
      label: What TanStack Query does
      description: If you know, how TanStack Query behaves in the same case
