name: Feature request
description: Something a Quarry tool could do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The API you have in mind, if any. If TanStack Query has it, link its docs.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
